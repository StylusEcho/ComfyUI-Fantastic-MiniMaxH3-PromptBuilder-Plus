[project]
name = "fantastic-minimax-h3-prompt-builder-plus"
# 2.0.0 broke saved workflows twice over, deliberately, in one release rather
# than spending two: it dropped the standalone Prompt Builder / Media Loader /
# Reference Splitter / Filename Prefix nodes in favour of Prompt Studio alone,
# and reordered Prompt Studio's outputs to put model first. Slots are positional,
# so links out of a pre-2.0.0 Prompt Studio come back one slot off and need
# reconnecting. See "Upgrading from 1.x" in the README.
# 2.1.0 folds in upstream 1.5.5/1.5.6 (node/text size controls replacing the
# old size-preset button, a crop-render crash fix, and the picture "bake"
# route) — no further breakage.
version = "2.1.0"
description = "MiniMax H3 Prompt Studio: a single guided prompt-writing and reference-media node for the H3 video model, with live checking against MiniMax's prompt guide."
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]

# PyAV is only needed for reference videos; images and audio work without it,
# and ffmpeg on PATH is an equally good alternative. It is declared here so a
# Manager install works for video out of the box. Left unpinned to avoid
# clashing with other packs that pin their own version.
dependencies = [
    "av",
]

[project.urls]
Repository = "https://github.com/StylusEcho/ComfyUI-Fantastic-MiniMaxH3-PromptBuilder-Plus"
"Bug Tracker" = "https://github.com/StylusEcho/ComfyUI-Fantastic-MiniMaxH3-PromptBuilder-Plus/issues"

[tool.comfy]
PublisherId = "adudeguyman"
DisplayName = "MiniMax H3 Prompt Studio"
requires-comfyui = ">=0.30.0"

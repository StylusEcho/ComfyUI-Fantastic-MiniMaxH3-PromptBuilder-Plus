name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Interface rework: the node's settings are text size only, and that size now reaches the prompt bar and the RefMods view; the RefMods view gets the same settings and toolbar as the media view. The Prompt Builder header starts with Media Loader, RefMods, Library, Draft, and its two-column Reference form moved into settings. One grip above the audio boxes sizes both. Subject masking is offered in Reference mode only. The Used view shows the pictures actually sent, T2VA's fields on the node no longer open Quick edit, and Quick edit's Prompt Builder button is centred. Fixes the node's panel squishing after a workflow tab switch with the side panel open.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

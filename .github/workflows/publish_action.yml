name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Folds in the original pack's 1.8.1: the trim and crop editor's size menu takes a custom long edge, the mask preview redraws on size and crop changes and no longer draws grow and the regenerated cells too large on a cropped clip, and RefMod cards number RefMods after Prompt Studio's media as the Text Encode will. The RefMod library gets its own window and text size under its gear, and opens ComfyUI-MiniMaxH3Mod bundles in Edit frames & voice, saving the result as standalone copies. Needs the original pack 1.8.1 or newer alongside for RefMods and masked editing.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Folds in the original pack's 1.8.2: RefMod Create can crop each picture and clip to its subject and blur the background (Batch Masking with SAM 3.1, and a Crop and mask window with dots and a brush), RefMod names must be unique, and a renamed RefMod keeps its new name in labels. Fixes the trim editor failing to open on any clip longer than 15 seconds. Adds an optional two-column layout for Reference mode in the Prompt Builder. Needs the original pack 1.8.2 or newer alongside for RefMods and masked editing.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        RefMods live on Prompt Studio now: the node's panel has a Media | RefMods switch, and the RefMods tab is the same twelve-slot grid as the RefMod Stack node (library, Create, presets, a weight per channel) holding the node's own picks, with no extra node or wiring. The RefMods button in the prompt editor opens those picks instead of adding a stack node. The RefMod Stack node stays for sharing one set across prompts: wired into Prompt Studio's mods input, its entries go first. Workflows built with a separate stack keep working unchanged.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

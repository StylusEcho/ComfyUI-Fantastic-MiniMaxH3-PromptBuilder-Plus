name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Folds in the original pack's 1.8.3: Prompt Studio, its RefMods and the RefMod library work across subgraphs (KJNodes Set/Get pairs too), and Clean up counts Prompt Studios inside them; Ctrl+V pastes pictures, clips and audio into Prompt Studio, the media window or the RefMod Create tab (added once even with the original pack installed); uploading a file that's already there reuses it; RefMod Create uploads are deleted once used. The new Reference Cache node comes from the original pack, which this wants at 1.8.3 or newer.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Folds in upstream 1.7.2 and 1.7.3. Subjects get a name: a name box per <Subject N> line, !Name shorthand anywhere in the prompt with Tab to complete it, and RefMods that store a subject name, appearance and voice description for Draft from RefMods to write in. Speaker buttons for a described voice become split buttons, so a line can name the voice. Right-click any tag, name or speaker ID to replace, swap or remove it in one place, one field or everywhere. The RefMod Stack node is rebuilt as twelve fixed slots with per-channel sliders labelled by tag, position badges and a Size control, and never resizes on its own; RefMod presets save a stack with its weights, and a prompt can link to one. Chained stacks show their position and upstream labels. No workflow breakage.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

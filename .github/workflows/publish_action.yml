name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # The publish action never passes a changelog on its own; set this
    # before the version-bump push, since registry versions are immutable.
    env:
      COMFY_NODE_CHANGELOG: |
        Folds in upstream 1.6.3, 1.6.4, 1.7.0 and 1.7.1. Adds RefMods: save a character, place, look or voice once as a small file in models/refmods and cite it from any prompt. Six new nodes come with it (RefMod Stack, RefMod Text Encode, RefMod Apply, Create, Inspect and Edit RefMod), all renamed for this pack so it still coexists with the original; the RefMod files themselves are shared. Prompt Studio's editor gets a RefMods button that adds and wires the stack, shows RefMods as chips beside your media, and keeps a draft's RefMods separate from Live. Also: a Delivery row for the community performance tags (pauses, whispering, laughs), the crop frame now follows a rotated picture, and Set/Get nodes between Prompt Studio and the Text Encode are followed. No workflow breakage.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
